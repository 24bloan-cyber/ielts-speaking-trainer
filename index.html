<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IELTS Speaking Trainer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 24px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      resize: vertical;
    }

    .modes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 10px;
    }

    .mode {
      border: 2px solid #ddd;
      border-radius: 12px;
      padding: 18px;
      cursor: pointer;
      transition: 0.2s;
    }

    .mode.active {
      border-color: #4f46e5;
      background: #f0efff;
    }

    .mode-title {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 6px;
    }

    .mode-description {
      color: #666;
      font-size: 14px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #startBtn {
      background: #16a34a;
      color: white;
    }

    #stopBtn {
      background: #dc2626;
      color: white;
    }

    #analyzeBtn {
      background: #4f46e5;
      color: white;
    }

    .timer {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin-top: 20px;
    }

    #status {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    #error {
      display: none;
      background: #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
      white-space: pre-wrap;
    }

    #result {
      display: none;
    }

    .scores {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .score {
      background: #f5f5f5;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .score-name {
      font-size: 14px;
      min-height: 40px;
    }

    .score-value {
      font-size: 28px;
      font-weight: bold;
      margin-top: 8px;
    }

    .overall {
      text-align: center;
      margin: 25px 0;
      padding: 20px;
      background: #f0efff;
      border-radius: 12px;
    }

    .overall-number {
      font-size: 42px;
      font-weight: bold;
      margin-top: 8px;
    }

    .section {
      margin-top: 25px;
    }

    .transcript,
    .feedback {
      background: #f8f8f8;
      padding: 16px;
      border-radius: 10px;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    @media (max-width: 700px) {
      .modes {
        grid-template-columns: 1fr;
      }

      .scores {
        grid-template-columns: 1fr 1fr;
      }

      .container {
        margin: 15px auto;
        padding: 15px;
      }
    }
  </style>
</head>


<body>

<div class="container">

  <h1>🎙 IELTS Speaking Trainer</h1>


  <!-- QUESTION -->

  <div class="card">

    <label for="question">
      Question / Topic
    </label>

    <textarea
      id="question"
      placeholder="Enter your IELTS Speaking question or topic..."
    ></textarea>

  </div>


  <!-- MODE -->

  <div class="card">

    <label>
      Speaking mode
    </label>

    <div class="modes">

      <div
        id="vnMode"
        class="mode active"
        onclick="selectMode('Vietnamese')"
      >

        <div class="mode-title">
          🇻🇳 Vietnamese
        </div>

        <div class="mode-description">
          Idea-development practice
        </div>

      </div>


      <div
        id="enMode"
        class="mode"
        onclick="selectMode('English')"
      >

        <div class="mode-title">
          🇬🇧 English
        </div>

        <div class="mode-description">
          Full IELTS Speaking assessment
        </div>

      </div>

    </div>

  </div>


  <!-- RECORDING -->

  <div class="card">

    <div class="buttons">

      <button
        id="startBtn"
        onclick="startRecording()"
      >
        🎙 Start recording
      </button>


      <button
        id="stopBtn"
        onclick="stopRecording()"
        disabled
      >
        ■ Stop
      </button>


      <button
        id="analyzeBtn"
        onclick="analyzeRecording()"
        disabled
      >
        ✨ Analyze
      </button>

    </div>


    <div
      class="timer"
      id="timer"
    >
      00:00
    </div>


    <div
      id="status"
    >
      Ready to record.
    </div>


    <div
      id="error"
    ></div>

  </div>


  <!-- RESULT -->

  <div
    class="card"
    id="result"
  >

    <h2>
      AI Evaluation
    </h2>


    <div class="scores">

      <div class="score">

        <div class="score-name">
          Fluency & Coherence
        </div>

        <div
          class="score-value"
          id="fluency"
        >
          -
        </div>

      </div>


      <div class="score">

        <div class="score-name">
          Lexical Resource
        </div>

        <div
          class="score-value"
          id="lexical"
        >
          -
        </div>

      </div>


      <div class="score">

        <div class="score-name">
          Grammar Range & Accuracy
        </div>

        <div
          class="score-value"
          id="grammar"
        >
          -
        </div>

      </div>


      <div class="score">

        <div class="score-name">
          Pronunciation
        </div>

        <div
          class="score-value"
          id="pronunciation"
        >
          -
        </div>

      </div>

    </div>


    <div class="overall">

      <div>
        Overall Band
      </div>

      <div
        class="overall-number"
        id="overall"
      >
        -
      </div>

    </div>


    <div class="section">

      <h3>
        Transcript
      </h3>

      <div
        class="transcript"
        id="transcript"
      ></div>

    </div>


    <div class="section">

      <h3>
        Detailed Feedback
      </h3>

      <div
        class="feedback"
        id="feedback"
      ></div>

    </div>

  </div>

</div>


<script>

/* =========================================================
   IMPORTANT
   DÁN WEB APP URL CỦA GOOGLE APPS SCRIPT VÀO ĐÂY
   ========================================================= */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxBqpDUf_OMPSnDLwcwYoETNRyvwe6tA4ig3eYZOU3DqGCO6dZ_XUPnCr1DxOKDxUMWnA/exec";


/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let selectedMode = "Vietnamese";

let mediaRecorder = null;

let audioChunks = [];

let audioBlob = null;

let timerInterval = null;

let recordingSeconds = 0;


/* =========================================================
   MODE
   ========================================================= */

function selectMode(mode) {

  selectedMode = mode;


  document
    .getElementById("vnMode")
    .classList
    .toggle(
      "active",
      mode === "Vietnamese"
    );


  document
    .getElementById("enMode")
    .classList
    .toggle(
      "active",
      mode === "English"
    );

}


/* =========================================================
   START RECORDING
   ========================================================= */

async function startRecording() {

  try {

    hideError();


    const question =
      document
        .getElementById("question")
        .value
        .trim();


    if (!question) {

      showError(
        "Nhập câu hỏi/topic trước nha."
      );

      return;
    }


    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          audio: true
        });


    audioChunks = [];

    audioBlob = null;


    mediaRecorder =
      new MediaRecorder(stream);


    mediaRecorder.ondataavailable =
      function(event) {

        if (event.data.size > 0) {

          audioChunks.push(
            event.data
          );

        }

      };


    mediaRecorder.onstop =
      function() {

        audioBlob =
          new Blob(
            audioChunks,
            {
              type: "audio/webm"
            }
          );


        document
          .getElementById("analyzeBtn")
          .disabled = false;


        document
          .getElementById("status")
          .textContent =
          "Recording finished. Ready to analyze.";


        stream
          .getTracks()
          .forEach(
            track => track.stop()
          );

      };


    mediaRecorder.start();


    recordingSeconds = 0;

    updateTimer();

    timerInterval =
      setInterval(
        updateTimer,
        1000
      );


    document
      .getElementById("startBtn")
      .disabled = true;


    document
      .getElementById("stopBtn")
      .disabled = false;


    document
      .getElementById("analyzeBtn")
      .disabled = true;


    document
      .getElementById("status")
      .textContent =
      "Recording...";

  }


  catch (error) {

    showError(
      error.message ||
      String(error)
    );

  }

}


/* =========================================================
   STOP RECORDING
   ========================================================= */

function stopRecording() {

  if (
    mediaRecorder &&
    mediaRecorder.state !== "inactive"
  ) {

    mediaRecorder.stop();

  }


  clearInterval(
    timerInterval
  );


  document
    .getElementById("startBtn")
    .disabled = false;


  document
    .getElementById("stopBtn")
    .disabled = true;

}


/* =========================================================
   TIMER
   ========================================================= */

function updateTimer() {

  const minutes =
    Math.floor(
      recordingSeconds / 60
    );


  const seconds =
    recordingSeconds % 60;


  document
    .getElementById("timer")
    .textContent =

    String(minutes)
      .padStart(2, "0")

    + ":" +

    String(seconds)
      .padStart(2, "0");


  recordingSeconds++;

}


/* =========================================================
   ANALYZE
   ========================================================= */

async function analyzeRecording() {

  if (!audioBlob) {

    showError(
      "Chưa có bản ghi âm."
    );

    return;

  }


  const question =
    document
      .getElementById("question")
      .value
      .trim();


  if (!question) {

    showError(
      "Nhập câu hỏi/topic trước nha."
    );

    return;

  }


  if (
    !APPS_SCRIPT_URL ||
    APPS_SCRIPT_URL.includes(
      "PASTE_YOUR"
    )
  ) {

    showError(
      "Chưa điền Google Apps Script Web App URL."
    );

    return;

  }


  const analyzeBtn =
    document
      .getElementById("analyzeBtn");


  analyzeBtn.disabled = true;


  hideError();


  document
    .getElementById("status")
    .textContent =
    "AI đang nghe và chấm bài...";


  try {

    const audioBase64 =
      await blobToBase64(
        audioBlob
      );


    const payload = {

      audioBase64:
        audioBase64,

      audioFormat:
        "audio/webm",

      question:
        question,

      mode:
        selectedMode,

      part:
        "",

      topic:
        ""

    };


    const response =
      await fetch(
        APPS_SCRIPT_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    const text =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(text);

    }

    catch (error) {

      throw new Error(
        "Apps Script không trả về JSON:\n\n" +
        text
      );

    }


    if (!data.ok) {

      throw new Error(
        data.error ||
        "Có lỗi khi phân tích bài nói."
      );

    }


    displayResult(
      data.result
    );


    document
      .getElementById("status")
      .textContent =
      "Done! Kết quả đã được lưu vào Google Sheets.";

  }


  catch (error) {

    showError(
      error.message ||
      String(error)
    );


    document
      .getElementById("status")
      .textContent =
      "Analysis failed.";

  }


  finally {

    analyzeBtn.disabled =
      false;

  }

}


/* =========================================================
   BLOB → BASE64
   ========================================================= */

function blobToBase64(blob) {

  return new Promise(
    function(resolve, reject) {

      const reader =
        new FileReader();


      reader.onloadend =
        function() {

          const result =
            reader.result;


          const base64 =
            result
              .split(",")[1];


          resolve(base64);

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        blob
      );

    }
  );

}


/* =========================================================
   DISPLAY RESULT
   ========================================================= */

function displayResult(result) {

  document
    .getElementById("result")
    .style.display =
    "block";


  document
    .getElementById("fluency")
    .textContent =
    result.fluency || "-";


  document
    .getElementById("lexical")
    .textContent =
    result.lexical || "-";


  document
    .getElementById("grammar")
    .textContent =
    result.grammar || "-";


  document
    .getElementById("pronunciation")
    .textContent =
    result.pronunciation || "-";


  document
    .getElementById("overall")
    .textContent =
    result.overall || "-";


  document
    .getElementById("transcript")
    .textContent =
    result.transcript || "";


  let feedback = "";


  if (
    selectedMode === "English"
  ) {

    feedback +=
      "FLUENCY & COHERENCE\n\n" +
      (result.fc_feedback || "") +
      "\n\n";


    feedback +=
      "LEXICAL RESOURCE\n\n" +
      (result.lr_feedback || "") +
      "\n\n";


    feedback +=
      "GRAMMAR RANGE & ACCURACY\n\n" +
      (result.gra_feedback || "") +
      "\n\n";


    feedback +=
      "PRONUNCIATION\n\n" +
      (result.pron_feedback || "") +
      "\n\n";

  }


  feedback +=
    "OVERALL\n\n" +
    (result.overall_feedback || "") +
    "\n\n";


  feedback +=
    "NEXT FOCUS\n\n" +
    (result.next_focus || "");


  document
    .getElementById("feedback")
    .textContent =
    feedback;

}


/* =========================================================
   ERROR
   ========================================================= */

function showError(message) {

  const error =
    document
      .getElementById("error");


  error.textContent =
    message;


  error.style.display =
    "block";

}


function hideError() {

  const error =
    document
      .getElementById("error");


  error.textContent = "";

  error.style.display =
    "none";

}

</script>

</body>
</html>
